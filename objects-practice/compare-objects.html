<!DOCTYPE html>
<html>

    <title>Object practice</title>

  <body>
    <script>
      const product1 = {
        name: 'cap' ,
        price: 500
      };
      const product2 ={
        name : 'cap',
        price: 500
      };
      function isSameProduct (product1,product2){
        if(product1.name === product2.name && product1.price === product2.price )
      {
        return(true);
      }
      else{
        return(false) ;
      }
      }
      console.log(isSameProduct(product1,product2));
    </script>
  </body>
