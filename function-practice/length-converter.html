<!DOCTYPE html>
<html>

<head>
  <title>Function practice</title>
</head>

<body>

  <script>
    function milesToKm(length) {
      return (length * 1.6);
    }
    function kmToMiles(length) {
      return (length / 1.6);
    }
    function mileToFt (length){
      return (length*5280);
    }
    function kmToFt(length){
      return (length*3281);
    }
    function ftToKm(length){
      return(length/3281);
    }
    function ftToMiles(length){
      return(length/5280);
    }

    function convertLength(length, from, to) {
        if (from !== 'km' && from !== 'miles' && from !== 'ft'){
          return (`invalid unit : ${from}`);
        }

         else if (to !== 'km' && to !== 'miles' && to !== 'ft'){
          return (`invalid unit : ${to}`);
        }

       else if (from === 'miles' && to === 'km') {
        const result = milesToKm(length);
        return (`${result} ${to}`);
      }

      else if (from === 'km' && to === 'miles') {
        const result = kmToMiles(length);
        return (`${result} ${to}`);
      }
       else if( from ===  to ){
        return (`${length} ${to}`);
      } 
      else if (from=== 'miles' && to=== 'ft'){
        const result = mileToFt (length);
        return(`${result} ${to}`)
      }
      else if (from === 'km' && to ==='ft'){
        const result =  kmToFt(length);
        return (`${result} ${ to}`);
      }
       else if (from === 'ft' && to ==='km'){
        const result =  ftToKm(length);
        return (`${result} ${ to}`);
      }
       else if (from === 'ft' && to ==='miles'){
        const result =  ftToMiles(length);
        return (`${result} ${ to}`);
      }
    }
      console.log(convertLength(50,'miles','km'));
      console.log(convertLength(32,'km','miles'));
      console.log(convertLength(50,'km','km'));
      console.log(convertLength(5,'miles','km'));
      console.log(convertLength(5,'miles','ft'));
      console.log(convertLength(5,'km','ft'));
      console.log(convertLength(5,'ibs','ibs'));
    console.log(convertLength(5,'ft','km'));
  </script>
</body>

</html>
