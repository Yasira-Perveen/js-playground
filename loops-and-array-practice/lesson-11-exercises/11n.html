<!DOCTYPE html>
<html>
  <head></head>
  <body>
    <script>
     
     function countWords(array){
        const outPut = {}; //object
        for ( let i = 0 ; i<array.length ; i++){
          const word = array[i];

        if ( !outPut[word]){
           outPut[word] = 1;
        }
        else {
          outPut[word] += 1;  
        }
        }
        return outPut ;
     }
     console.log(countWords(['apple','grap','apple','apple']));
     console.log(countWords(['cat', 'dog', 'cat', 'bird', 'dog', 'cat']));
      console.log(countWords(['x', 'y', 'z'] ));
     console.log(countWords([]));
     console.log(countWords(['Apple', 'apple']));
    </script>
  </body>
</html>
