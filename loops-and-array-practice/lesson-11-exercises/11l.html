<body>
  <script>
    function minMax(array) {
      const result = {
        min: array[0],
        max: array[0]
      };

      for (let i = 1; i < array.length; i++) {
        if (array[i] < result.min) {
          result.min = array[i];
        }
        if (array[i] > result.max) {
          result.max = array[i];
        }
      }
      return result;
    }
    console.log(minMax([1, -3, 5]));
    console.log(minMax([-2, 3, -5, 7, 10]));

  </script>
</body>
