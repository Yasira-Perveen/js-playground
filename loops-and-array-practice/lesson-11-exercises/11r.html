<!DOCTYPE html>
<html>

<head>
  <title>Lesson 11 Loops and Arrays</title>
</head>

<body>
  <script>
    
    function removeEgg(array){
      const array2 = [];
      for (let i=0; i<array.length; i++){
        const string = array[i];
        if(string === 'egg'){
          continue;
        }
        else {
          array2.push(string);
        }
      }
         return array2;
    }

    console.log( removeEgg( ['egg', 'apple','egg', 'egg','ham']));
    
  </script>
</body>

</html>
