<!doctype html>
<html>
  <head>
    <title>Lesson 12</title>
  </head>
  <body>
    <script>
      const countPositive = function (nums) {
        let count = 0;
        nums.forEach((value, index) => {
          if (value > 0) {
            count++;
          }
        });
        return count;
      };
      console.log(countPositive([1, -3, 5]));
      console.log(countPositive([-2, 3, -5, 7, 10]));
    </script>
  </body>
</html>
