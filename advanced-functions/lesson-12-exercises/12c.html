<!DOCTYPE html>
<html>

<head>
  <title>Lesson 12 Advanced Functions</title>
</head>

<body>
  <button class="js-button" onclick="
    updateButton();
    ">Start</button>
  <script>
    const buttonElement = document.querySelector('.js-button');
    function updateButton() {
      setTimeout(function () {
        buttonElement.innerText = 'Finished!';
      }, 1000
      )
    }
  </script>
</body>

</html>
