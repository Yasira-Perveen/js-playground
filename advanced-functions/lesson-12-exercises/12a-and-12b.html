<!DOCTYPE html>
<html>

<head>
  <title>Lesson 12 Advanced Functions</title>
</head>

<body>
  <script>
    //12a
    const add = function () {
      console.log(2 + 3);
    }
    add();
    add();

    //12b

    function runTwice(fun) {
      fun();
      fun();
    }
    runTwice(function () {
      console.log('12b');
    });

    runTwice(add);
  </script>
</body>

</html>
